<!doctype html>
<html lang="zh-Hant" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logos/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <!-- Title, description, canonical and Open Graph tags come from each
         page's <Seo> (src/components/Seo.tsx); scripts/prerender.mjs bakes
         them into every route's HTML at build time. -->
    <meta property="og:locale" content="zh_TW" />

    <!-- Arc's hero title starts at opacity 0 and is revealed by script. Without
         JS the prerendered text would stay invisible, so show it. -->
    <noscript>
      <style>
        h1,
        h1 * {
          opacity: 1 !important;
          filter: none !important;
          transform: none !important;
        }
      </style>
    </noscript>
    <!-- Google AdSense. Loads async so it never blocks first paint. -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-0107538119751408"
      crossorigin="anonymous"
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Geist for text, Geist Mono for labels and code, Noto Sans TC for the CJK
         glyphs neither carries. The pixel display faces are self-hosted (public/fonts). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap"
    />
    <link rel="preload" href="/fonts/GeistPixel-Square.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

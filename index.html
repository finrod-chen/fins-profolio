<!doctype html>
<html lang="zh-Hant" data-accent="blue">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logos/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <!-- Title, description, canonical and Open Graph tags come from each
         page's <Seo> (src/components/Seo.tsx); scripts/prerender.mjs bakes
         them into every route's HTML at build time. -->
    <meta property="og:locale" content="zh_TW" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Arc's two faces (Geist for display, Inter for body) plus Noto Sans TC,
         which carries the CJK glyphs neither of them has, and JetBrains Mono for code. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400..600&family=Noto+Sans+TC:wght@400;500&display=swap"
    />
    <script>
      // Stamps data-theme before first paint so the stored choice never flashes.
      try {
        var stored = localStorage.getItem("finrod-theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
